<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 2800" width="100%" height="100%">
    <style>
        .line { fill: none; stroke: black; stroke-width: 2.5; }
        .shape { fill: white; stroke: black; stroke-width: 2.5; }
        .text { font-family: Arial, sans-serif; font-size: 24px; fill: black; text-anchor: middle; dominant-baseline: central; }
        .label { font-family: Arial, sans-serif; font-size: 22px; fill: black; }
        .bg { fill: white; stroke: none; }
    </style>
    <rect class="bg" x="0" y="0" width="1700" height="2800"/>

    <defs>
        <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0,0 L 12,6 L 0,12 Z" style="fill: black; stroke: none;" />
        </marker>
        <rect id="term" x="-150" y="-37.5" width="300" height="75" rx="37.5" ry="37.5" class="shape" />
        <rect id="rect" x="-150" y="-75" width="300" height="150" class="shape" />
        <g id="proc">
            <rect x="-150" y="-75" width="300" height="150" class="shape" />
            <line x1="-110" x2="-110" y1="-75" y2="75" class="line" />
            <line x1="110" x2="110" y1="-75" y2="75" class="line" />
        </g>
        <polygon id="data" points="-110,-75 150,-75 110,75 -150,75" class="shape" />
        <polygon id="rhomb" points="0,-75 150,0 0,75 -150,0" class="shape" />
    </defs>

    <!-- ============================================================== -->
    <!-- ЛЕВАЯ КОЛОНКА: Инициализация и Авторизация (Ось X = 400)       -->
    <!-- ============================================================== -->

    <g transform="translate(400, 100)">
        <use href="#term"/>
        <text x="0" y="0" class="text">Начало</text>
    </g>
    <path d="M 400,137.5 L 400,175" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(400, 250)">
        <use href="#proc"/>
        <text x="0" y="-20" class="text">выклік ф.</text>
        <text x="0" y="20" class="text">sys_init(&amp;sys)</text>

        <!-- БЛОК КОММЕНТАРИЯ: Структуры AirportSystem и Flight -->
        <line x1="150" y1="0" x2="180" y2="0" class="line" stroke-dasharray="8,6" />
        <path d="M 190,-120 L 180,-120 L 180,240 L 190,240" class="line" />
        <g style="text-anchor: start; dominant-baseline: central;">
            <text x="200" y="-110" class="label" style="font-size: 18px;">struct AirportSystem {</text>
            <text x="210" y="-85" class="label" style="font-size: 18px;">Flight flights[1024];</text>
            <text x="210" y="-60" class="label" style="font-size: 18px;">int count;</text>
            <text x="210" y="-35" class="label" style="font-size: 18px;">Stack history;</text>
            <text x="210" y="-10" class="label" style="font-size: 18px;">Queue pendingQueue;</text>
            <text x="210" y="15" class="label" style="font-size: 18px;">TreeNode *searchTree;</text>
            <text x="200" y="40" class="label" style="font-size: 18px;">}</text>

            <text x="200" y="80" class="label" style="font-size: 18px;">struct Flight {</text>
            <text x="210" y="105" class="label" style="font-size: 18px;">char flightNumber[10];</text>
            <text x="210" y="130" class="label" style="font-size: 18px;">char airline[50];</text>
            <text x="210" y="155" class="label" style="font-size: 18px;">DateTime scheduleTime;</text>
            <text x="210" y="180" class="label" style="font-size: 18px;">FlightStatus status;</text>
            <text x="210" y="205" class="label" style="font-size: 18px;">...</text>
            <text x="200" y="230" class="label" style="font-size: 18px;">}</text>
        </g>
    </g>
    <path d="M 400,325 L 400,375" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(400, 450)">
        <use href="#data"/>
        <text x="0" y="-20" class="text">Вывад</text>
        <text x="0" y="20" class="text">загалоўка</text>
    </g>
    <path d="M 400,525 L 400,575" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(400, 650)">
        <use href="#rect"/>
        <text x="0" y="-20" class="text">Прысв. знач.</text>
        <text x="0" y="20" class="text">attempts = 0</text>

        <!-- БЛОК КОММЕНТАРИЯ: Структура User -->
        <line x1="150" y1="0" x2="180" y2="0" class="line" stroke-dasharray="8,6" />
        <path d="M 190,-60 L 180,-60 L 180,80 L 190,80" class="line" />
        <g style="text-anchor: start; dominant-baseline: central;">
            <text x="200" y="-50" class="label" style="font-size: 18px;">struct User {</text>
            <text x="210" y="-25" class="label" style="font-size: 18px;">char username[30];</text>
            <text x="210" y="0" class="label" style="font-size: 18px;">char password[30];</text>
            <text x="210" y="25" class="label" style="font-size: 18px;">UserRole role;</text>
            <text x="200" y="50" class="label" style="font-size: 18px;">}</text>
        </g>
    </g>
    
    <!-- Точка слияния возврата цикла. Сразу после нее - стрелка в условие -->
    <path d="M 400,725 L 400,760" class="line" />
    <path d="M 400,760 L 400,800" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(400, 875)">
        <use href="#rhomb"/>
        <text x="0" y="-20" class="text">!auth_login</text>
        <text x="0" y="20" class="text">(...)?</text>
    </g>
    <!-- Отступы для текста, чтобы не наезжали на линии -->
    <text x="440" y="980" class="label">Так</text>
    <text x="580" y="850" class="label">Не</text>
    
    <!-- Ветка ТАК (вниз) -->
    <path d="M 400,950 L 400,1025" class="line" marker-end="url(#arrow)"/>

    <!-- Ветка НЕ (вправо к успешному входу) -->
    <path d="M 550,875 L 1200,875 L 1200,925" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(400, 1100)">
        <use href="#rect"/>
        <text x="0" y="-20" class="text">Прысв. знач.</text>
        <text x="0" y="20" class="text">attempts++</text>
    </g>
    <path d="M 400,1175 L 400,1225" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(400, 1300)">
        <use href="#rhomb"/>
        <text x="0" y="0" class="text">attempts &gt;= 3?</text>
    </g>
    <text x="440" y="1410" class="label">Не</text>
    <text x="580" y="1275" class="label">Так</text>
    
    <!-- Ветка НЕ (вниз) -->
    <path d="M 400,1375 L 400,1450" class="line" marker-end="url(#arrow)"/>

    <!-- Возврат к началу цикла -->
    <g transform="translate(400, 1525)">
        <use href="#data"/>
        <text x="0" y="-20" class="text">Вывад</text>
        <text x="0" y="20" class="text">"Invalid..."</text>
    </g>
    <path d="M 400,1600 L 400,1650 L 100,1650 L 100,760 L 400,760" class="line"/>

    <!-- Ветка ТАК (вправо, ошибка авторизации, колонка X = 800) -->
    <path d="M 550,1300 L 800,1300 L 800,1350" class="line" marker-end="url(#arrow)"/>
    
    <g transform="translate(800, 1425)">
        <use href="#data"/>
        <text x="0" y="-20" class="text">Вывад</text>
        <text x="0" y="20" class="text">"Too many..."</text>
    </g>
    <path d="M 800,1500 L 800,1550" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(800, 1625)">
        <use href="#proc"/>
        <text x="0" y="-20" class="text">выклік ф.</text>
        <text x="0" y="20" class="text">sys_free(&amp;sys)</text>
    </g>
    
    <!-- Линия уходит вниз и вправо к точке слияния перед общим Концом -->
    <path d="M 800,1700 L 800,2550 L 1200,2550" class="line" />

    <!-- ============================================================== -->
    <!-- ПРАВАЯ КОЛОНКА: Главное меню и Выход (Ось X = 1200)            -->
    <!-- ============================================================== -->

    <g transform="translate(1200, 1000)">
        <use href="#data"/>
        <text x="0" y="-20" class="text">Вывад</text>
        <text x="0" y="20" class="text">"Welcome..."</text>
    </g>
    <path d="M 1200,1075 L 1200,1125" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(1200, 1200)">
        <use href="#proc"/>
        <text x="0" y="-20" class="text">выклік ф.</text>
        <text x="0" y="20" class="text">input_choose(...)</text>
    </g>
    <path d="M 1200,1275 L 1200,1325" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(1200, 1400)">
        <use href="#proc"/>
        <text x="0" y="-20" class="text">выклік ф.</text>
        <text x="0" y="20" class="text">menu_main(...)</text>
    </g>
    <path d="M 1200,1475 L 1200,1525" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(1200, 1600)">
        <use href="#rhomb"/>
        <text x="0" y="0" class="text">sys.count &gt; 0?</text>
    </g>
    <text x="1240" y="1710" class="label">Так</text>
    <text x="1380" y="1575" class="label">Не</text>
    
    <!-- Ветка ТАК (вниз) -->
    <path d="M 1200,1675 L 1200,1725" class="line" marker-end="url(#arrow)"/>

    <!-- Ветка НЕ (вправо) -->
    <path d="M 1350,1600 L 1550,1600 L 1550,2320 L 1200,2320" class="line"/>

    <g transform="translate(1200, 1800)">
        <use href="#data"/>
        <text x="0" y="-20" class="text">Увод</text>
        <text x="0" y="20" class="text">save</text>
    </g>
    <path d="M 1200,1875 L 1200,1925" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(1200, 2000)">
        <use href="#rhomb"/>
        <text x="0" y="0" class="text">save == 1?</text>
    </g>
    <text x="1240" y="2110" class="label">Так</text>
    <text x="1380" y="1975" class="label">Не</text>
    
    <!-- Ветка ТАК (вниз) -->
    <path d="M 1200,2075 L 1200,2125" class="line" marker-end="url(#arrow)"/>
    
    <!-- Ветка НЕ (вправо) -->
    <path d="M 1350,2000 L 1450,2000 L 1450,2320 L 1200,2320" class="line"/>

    <g transform="translate(1200, 2200)">
        <use href="#proc"/>
        <text x="0" y="-20" class="text">выклік ф.</text>
        <text x="0" y="20" class="text">output_choose(...)</text>
    </g>
    
    <!-- Место слияния всех веток завершения (Y = 2320) -->
    <path d="M 1200,2275 L 1200,2320" class="line" />
    <path d="M 1200,2320 L 1200,2375" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(1200, 2450)">
        <use href="#proc"/>
        <text x="0" y="-20" class="text">выклік ф.</text>
        <text x="0" y="20" class="text">sys_free(&amp;sys)</text>
    </g>

    <!-- Линия от правого блока sys_free вниз до точки слияния -->
    <path d="M 1200,2525 L 1200,2550" class="line" />

    <!-- Общая стрелка, входящая в блок Конец -->
    <path d="M 1200,2550 L 1200,2587.5" class="line" marker-end="url(#arrow)"/>

    <g transform="translate(1200, 2625)">
        <use href="#term"/>
        <text x="0" y="0" class="text">Конец</text>
    </g>

</svg>