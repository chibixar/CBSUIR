<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2121" width="210mm" height="297mm">
    <style>
        rect, polygon, path, line, circle, polyline { fill: none; stroke: black; stroke-width: 1.5; }
        text { font-family: Arial, sans-serif; font-size: 14px; fill: black; stroke: none; }
        .bg { fill: white; stroke: none; }
    </style>
    <rect class="bg" x="0" y="0" width="800" height="1750"/>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0,0 L 10,5 L 0,10 Z" style="fill: black; stroke: none;" />
        </marker>
        <!-- TERMINAL (H=60) -->
        <rect id="term" x="-120" y="-30" width="240" height="60" rx="30" ry="30" />
        <!-- PROCESS (W=240, H=120) -->
        <rect id="rect" x="-120" y="-60" width="240" height="120" />
        <!-- PREPROC -->
        <g id="proc">
            <rect x="-120" y="-60" width="240" height="120" />
            <line x1="-90" x2="-90" y1="-60" y2="60" />
            <line x1="90" x2="90" y1="-60" y2="60" />
        </g>
        <!-- DECISION -->
        <polygon id="rhomb" points="0,-60 120,0 0,60 -120,0" />
    </defs>

    <!-- СЛУП 1 -->
    <g transform="translate(250, 100)">
        <use href="#term"/>
        <text x="0" y="5" text-anchor="middle">Начало</text>
    </g>
    <path d="M 250,130 L 250,200" marker-end="url(#arrow)" />

    <g transform="translate(250, 260)">
        <use href="#rect"/>
        <text x="0" y="-10" text-anchor="middle">Ув: sys, idx</text>
        <text x="0" y="10" text-anchor="middle">Вых: няма</text>
    </g>
    <path d="M 250,320 L 250,360" marker-end="url(#arrow)" />

    <g transform="translate(250, 420)">
        <use href="#rhomb"/>
        <text x="0" y="-10" text-anchor="middle">idx &lt; 0 ці</text>
        <text x="0" y="10" text-anchor="middle">idx &gt;= count?</text>
    </g>
    <path d="M 250,480 L 250,520" marker-end="url(#arrow)" />
    <text x="265" y="500">Не</text>

    <!-- Early return (Yes) - ИСПРАВЛЕНО: Слияние с вертикальной линией перед "Конец" (Y=1635) -->
    <path d="M 370,420 L 600,420 L 600,1635 L 250,1635" />
    <text x="380" y="410">Так</text>

    <g transform="translate(250, 580)">
        <use href="#proc"/>
        <text x="0" y="-10" text-anchor="middle">выклік ф.</text>
        <text x="0" y="10" text-anchor="middle">stack_push(...)</text>
    </g>
    <path d="M 250,640 L 250,680" marker-end="url(#arrow)" />

    <g transform="translate(250, 740)">
        <use href="#proc"/>
        <text x="0" y="-10" text-anchor="middle">выклік ф.</text>
        <text x="0" y="10" text-anchor="middle">bst_delete(...)</text>
    </g>
    <path d="M 250,800 L 250,840" marker-end="url(#arrow)" />

    <g transform="translate(250, 900)">
        <use href="#rect"/>
        <text x="0" y="-10" text-anchor="middle">Прысв. знач.</text>
        <text x="0" y="10" text-anchor="middle">i = idx</text>
    </g>
    
    <!-- Вертикальная линия, идущая в ромб -->
    <path d="M 250,960 L 250,1000" marker-end="url(#arrow)" />

    <g transform="translate(250, 1060)">
        <use href="#rhomb"/>
        <text x="0" y="5" text-anchor="middle">i &lt; count - 1?</text>
    </g>
    <path d="M 250,1120 L 250,1160" marker-end="url(#arrow)" />
    <text x="265" y="1140">Так</text>

    <!-- Loop exit (No branch) - Хвостик исправлен ранее -->
    <path d="M 370,1060 L 450,1060 L 450,1460 L 250,1460 L 250,1480" marker-end="url(#arrow)" />
    <text x="380" y="1050">Не</text>

    <g transform="translate(250, 1220)">
        <use href="#rect"/>
        <text x="0" y="-10" text-anchor="middle">Прысв. знач.</text>
        <text x="0" y="10" text-anchor="middle">flights[i] = flights[i+1]</text>
    </g>
    <path d="M 250,1280 L 250,1320" marker-end="url(#arrow)" />

    <g transform="translate(250, 1380)">
        <use href="#rect"/>
        <text x="0" y="-10" text-anchor="middle">Прысв. знач.</text>
        <text x="0" y="10" text-anchor="middle">i = i + 1</text>
    </g>
    
    <!-- Loop back - Слияние исправлено ранее -->
    <path d="M 250,1440 L 250,1450 L 70,1450 L 70,980 L 250,980" />

    <g transform="translate(250, 1540)">
        <use href="#rect"/>
        <text x="0" y="-10" text-anchor="middle">Прысв. знач.</text>
        <text x="0" y="10" text-anchor="middle">count = count - 1</text>
    </g>
    
    <!-- Последняя вертикальная линия в блок Конец (к ней теперь примыкает правая ветка) -->
    <path d="M 250,1600 L 250,1670" marker-end="url(#arrow)" />

    <g transform="translate(250, 1700)">
        <use href="#term"/>
        <text x="0" y="5" text-anchor="middle">Конец</text>
    </g>
</svg>