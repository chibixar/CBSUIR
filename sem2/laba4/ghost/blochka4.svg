<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 2121" width="210mm" height="297mm">
    <style>
        rect, polygon, path, line, circle, polyline { fill: none; stroke: black; stroke-width: 1.5; }
        text { font-family: Arial, sans-serif; font-size: 14px; fill: black; stroke: none; }
        .bg { fill: white; stroke: none; }
    </style>
    <rect class="bg" x="0" y="0" width="1500" height="2121"/>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0,0 L 10,5 L 0,10 Z" style="fill: black; stroke: none;" />
        </marker>

        <!-- 1. TERMINAL (H=60) -->
        <rect id="term" x="-120" y="-30" width="240" height="60" rx="30" ry="30" />
        
        <!-- 2. PROCESS (W=240, H=120) -->
        <rect id="rect" x="-120" y="-60" width="240" height="120" />
        
        <!-- 3. PREPROC. Strict 1:6:1 Ratio. -->
        <g id="proc">
            <rect x="-120" y="-60" width="240" height="120" />
            <line x1="-90" x2="-90" y1="-60" y2="60" />
            <line x1="90" x2="90" y1="-60" y2="60" />
        </g>
        
        <!-- 4. DECISION (Rhombus) -->
        <polygon id="rhomb" points="0,-60 120,0 0,60 -120,0" />
        
        <!-- 5. I/O (Parallelogram) -->
        <polygon id="io" points="-90,-60 120,-60 90,60 -120,60" />

        <!-- 6. CONNECTOR (Circle R=25) -->
        <circle id="conn" cx="0" cy="0" r="25" />
    </defs>

    <!-- ================= COLUMN 1 (X=250) ================= -->
    
    <!-- Node 1: Начало -->
    <g transform="translate(250, 100)">
        <use href="#term" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold">Начало</text>
    </g>
    <path d="M 250,130 L 250,235" marker-end="url(#arrow)" />

    <!-- Node 2: Variables Declaration -->
    <g transform="translate(250, 300)">
        <use href="#rect" />
        <text x="0" y="-48" font-size="12" text-anchor="middle">Вх: масіў char target_ilness</text>
        <text x="0" y="-35" font-size="12" text-anchor="middle">Child children - масіў структур дзяцей</text>
        <text x="0" y="-20" font-size="12" text-anchor="middle"> Вых: int number_of_children = 0;</text>
        <text x="0" y="-4" font-size="12" text-anchor="middle">char target_illness[MAX];</text>
        <text x="0" y="12" font-size="12" text-anchor="middle">int result_count = 0;</text>
        <text x="0" y="28" font-size="12" text-anchor="middle">Child *children = NULL;</text>
        <text x="0" y="44" font-size="12" text-anchor="middle">Child *c_w_t_illness = NULL;</text>
        
        <!-- Struct Annotation 1 (Child & MedicalInfo) attached to Node 2 -->
        <line x1="120" y1="0" x2="140" y2="0" stroke-dasharray="6,4" />
        <path d="M 145,-60 L 140,-60 L 140,85 L 145,85" />
        <g style="text-anchor: start;">
            <text x="150" y="-45" font-size="11" font-weight="bold">struct Child {</text>
            <text x="150" y="-30" font-size="11">  char first_name[MAX_ALLOW];</text>
            <text x="150" y="-15" font-size="11">  char surname[MAX_ALLOW];</text>
            <text x="150" y="0" font-size="11">  int age;</text>
            <text x="150" y="15" font-size="11">  int was_hospitalized;</text>
            <text x="150" y="30" font-size="11">  MedicalInfo health_info; };</text>
            <text x="150" y="50" font-size="11" font-weight="bold">union MedicalInfo {</text>
            <text x="150" y="65" font-size="11">  LocalRecord local;</text>
            <text x="150" y="80" font-size="11">  HospitalRecord hospital; };</text>
        </g>
    </g>
    <path d="M 250,360 L 250,435" marker-end="url(#arrow)" />

    <!-- Node 3: choose_input -->
    <g transform="translate(250, 500)">
        <use href="#proc" />
        <text x="0" y="-15" font-size="14" text-anchor="middle">вызов ф.</text>
        <text x="0" y="5" font-size="12" text-anchor="middle">choose_input(&amp;children,</text>
        <text x="0" y="25" font-size="12" text-anchor="middle">&amp;number_of_children)</text>
        
        <!-- Struct Annotation 2 (Hospital & Local) attached to Node 3 -->
        <line x1="120" y1="0" x2="140" y2="0" stroke-dasharray="6,4" />
        <path d="M 145,-50 L 140,-50 L 140,75 L 145,75" />
        <g style="text-anchor: start;">
            <text x="150" y="-35" font-size="11" font-weight="bold">struct HospitalRecord {</text>
            <text x="150" y="-20" font-size="11">  char illness[MAX_ALLOW];</text>
            <text x="150" y="-5" font-size="11">  char att_doctor[MAX_ALLOW];</text>
            <text x="150" y="10" font-size="11">  char adress[MAX_ALLOW];</text>
            <text x="150" y="25" font-size="11">  int hospital_number; };</text>
            <text x="150" y="45" font-size="11" font-weight="bold">struct LocalRecord {</text>
            <text x="150" y="60" font-size="11">  char illness[MAX_ALLOW];</text>
            <text x="150" y="75" font-size="11">  char loc_doctor[MAX_ALLOW]; };</text>
        </g>
    </g>
    <path d="M 250,560 L 250,635" marker-end="url(#arrow)" />

    <!-- Node 4: output_Child -->
    <g transform="translate(250, 700)">
        <use href="#proc" />
        <text x="0" y="-15" font-size="14" text-anchor="middle">вызов ф.</text>
        <text x="0" y="5" font-size="12" text-anchor="middle">output_Child(children,</text>
        <text x="0" y="25" font-size="12" text-anchor="middle">number_of_children)</text>
    </g>
    <path d="M 250,760 L 250,835" marker-end="url(#arrow)" />

    <!-- Node 5: choose_output -->
    <g transform="translate(250, 900)">
        <use href="#proc" />
        <text x="0" y="-15" font-size="14" text-anchor="middle">вызов ф.</text>
        <text x="0" y="5" font-size="12" text-anchor="middle">choose_output(children,</text>
        <text x="0" y="25" font-size="12" text-anchor="middle">number_of_children)</text>
    </g>
    <path d="M 250,960 L 250,1035" marker-end="url(#arrow)" />

    <!-- Node 6: printf (I/O) -->
    <g transform="translate(250, 1100)">
        <use href="#io" />
        <text x="0" y="-10" font-size="14" text-anchor="middle">Вывод:</text>
        <text x="0" y="10" font-size="11" text-anchor="middle">"Enter the target illness: "</text>
    </g>
    <path d="M 250,1160 L 250,1235" marker-end="url(#arrow)" />

    <!-- Node 7: read_line -->
    <g transform="translate(250, 1300)">
        <use href="#proc" />
        <text x="0" y="-20" font-size="14" text-anchor="middle">вызов ф.</text>
        <text x="0" y="5" font-size="12" text-anchor="middle">read_line(target_illness,</text>
        <text x="0" y="25" font-size="12" text-anchor="middle">MAX_ALLOWED, stdin)</text>
    </g>
    <path d="M 250,1360 L 250,1435" marker-end="url(#arrow)" />

    <!-- Node 8: children_analysis -->
    <g transform="translate(250, 1500)">
        <use href="#proc" />
        <text x="0" y="-20" font-size="14" text-anchor="middle">вызов ф.</text>
        <text x="0" y="5" font-size="11" text-anchor="middle">children_analysis(children,</text>
        <text x="0" y="20" font-size="11" text-anchor="middle">number_of_children,</text>
        <text x="0" y="35" font-size="11" text-anchor="middle">&amp;c_w_t_illness, ...)</text>
    </g>
    <path d="M 250,1560 L 250,1635" marker-end="url(#arrow)" />

    <!-- Node 9: Decision -->
    <g transform="translate(250, 1700)">
        <use href="#rhomb" />
        <text x="0" y="5" font-size="14" text-anchor="middle">!result_count</text>
    </g>
    
    <!-- Path "Нет" (False) -->
    <path d="M 250,1760 L 250,1835" marker-end="url(#arrow)" />
    <text x="260" y="1790" font-size="14" text-anchor="start">Нет</text>

    <!-- Connector A (False path continuation) -->
    <g transform="translate(250, 1865)">
        <use href="#conn" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold">A</text>
    </g>

    <!-- Path "Да" (True) -->
    <path d="M 370,1700 L 450,1700 L 450,1835" marker-end="url(#arrow)" />
    <text x="390" y="1690" font-size="14" text-anchor="start">Да</text>

    <!-- Connector B (True path continuation) -->
    <g transform="translate(450, 1865)">
        <use href="#conn" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold">B</text>
    </g>


    <!-- ================= COLUMN 2 (X=750) ================= -->

    <!-- Entry Connector A -->
    <g transform="translate(750, 100)">
        <use href="#conn" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold">A</text>
    </g>
    <path d="M 750,125 L 750,185" marker-end="url(#arrow)" />

    <!-- Node 10: output_Child -->
    <g transform="translate(750, 250)">
        <use href="#proc" />
        <text x="0" y="-15" font-size="14" text-anchor="middle">вызов ф.</text>
        <text x="0" y="5" font-size="11" text-anchor="middle">output_Child(</text>
        <text x="0" y="20" font-size="11" text-anchor="middle">c_w_t_illness, result_count)</text>
    </g>
    <path d="M 750,310 L 750,385" marker-end="url(#arrow)" />

    <!-- Node 11: choose_output -->
    <g transform="translate(750, 450)">
        <use href="#proc" />
        <text x="0" y="-15" font-size="14" text-anchor="middle">вызов ф.</text>
        <text x="0" y="5" font-size="11" text-anchor="middle">choose_output(</text>
        <text x="0" y="20" font-size="11" text-anchor="middle">c_w_t_illness, result_count)</text>
    </g>
    <path d="M 750,510 L 750,585" marker-end="url(#arrow)" />

    <!-- Node 12: free(children) -->
    <g transform="translate(750, 650)">
        <use href="#proc" />
        <text x="0" y="-10" font-size="14" text-anchor="middle">вызов ф.</text>
        <text x="0" y="10" font-size="12" text-anchor="middle">free(children)</text>
    </g>
    <path d="M 750,710 L 750,785" marker-end="url(#arrow)" />

    <!-- Node 13: free(c_w_t_illness) -->
    <g transform="translate(750, 850)">
        <use href="#proc" />
        <text x="0" y="-10" font-size="14" text-anchor="middle">вызов ф.</text>
        <text x="0" y="10" font-size="11" text-anchor="middle">free(c_w_t_illness)</text>
    </g>
    <path d="M 750,910 L 750,1015" marker-end="url(#arrow)" />

    <!-- Terminal End -->
    <g transform="translate(750, 1050)">
        <use href="#term" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold">Конец</text>
    </g>


    <!-- ================= COLUMN 3 (X=1250) ================= -->

    <!-- Entry Connector B -->
    <g transform="translate(1250, 100)">
        <use href="#conn" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold">B</text>
    </g>
    <path d="M 1250,125 L 1250,185" marker-end="url(#arrow)" />

    <!-- Node 15: printf (I/O) -->
    <g transform="translate(1250, 250)">
        <use href="#io" />
        <text x="0" y="-10" font-size="14" text-anchor="middle">Вывод:</text>
        <text x="0" y="10" font-size="11" text-anchor="middle">"No children found with..."</text>
    </g>
    <path d="M 1250,310 L 1250,385" marker-end="url(#arrow)" />

    <!-- Node 16: free(children) -->
    <g transform="translate(1250, 450)">
        <use href="#proc" />
        <text x="0" y="-10" font-size="14" text-anchor="middle">вызов ф.</text>
        <text x="0" y="10" font-size="12" text-anchor="middle">free(children)</text>
    </g>
    
    <!-- Path Merging Col 3 flow into Col 2 (End logic) -->
    <path d="M 1250,510 L 1250,960 L 750,960" />

</svg>