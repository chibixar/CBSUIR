<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1485" width="210mm" height="297mm">
    <style>
        rect, polygon, path, line, circle, polyline { fill: none; stroke: black; stroke-width: 1.5; }
        text { font-family: Arial, sans-serif; font-size: 15px; fill: black; stroke: none; }
        .bg { fill: white; stroke: none; }
    </style>
    <rect class="bg" x="0" y="0" width="1050" height="1485"/>

    <defs>
        <!-- КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ СТРЕЛОК: refX="10" и userSpaceOnUse фиксируют острие строго на координате конца линии -->
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M 0,0 L 10,5 L 0,10 Z" style="fill: black; stroke: none;" />
        </marker>

        <!-- 1. TERMINAL (H=60) -->
        <rect id="term" x="-120" y="-30" width="240" height="60" rx="30" ry="30" />
        
        <!-- 2. PROCESS (W=240, H=120) -->
        <rect id="rect" x="-120" y="-60" width="240" height="120" />
        
        <!-- 3. PREPROC. Strict 1:6:1 Ratio. -->
        <g id="proc">
            <rect x="-120" y="-60" width="240" height="120" />
            <line x1="-90" x2="-90" y1="-60" y2="60" />
            <line x1="90" x2="90" y1="-60" y2="60" />
        </g>
        
        <!-- 4. DECISION (Rhombus) -->
        <polygon id="rhomb" points="0,-60 120,0 0,60 -120,0" />
        
        <!-- 5. I/O (Parallelogram) -->
        <polygon id="io" points="-90,-60 120,-60 90,60 -120,60" />

        <!-- 6. CONNECTOR (Circle R=25) -->
        <circle id="conn" cx="0" cy="0" r="25" />
    </defs>

    <!-- ================= СТАРОНКА 1 / СЛУП 1 (X=250) ================= -->
    
    <!-- Node 1: Пачатак -->
    <g transform="translate(250, 100)">
        <use href="#term" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold" font-size="16">Пачатак</text>
    </g>
    <!-- Start: 100+30=130 | End: 280-60=220 -->
    <path d="M 250,130 L 250,220" marker-end="url(#arrow)" />

    <!-- Node 2: Variables Declaration -->
    <g transform="translate(250, 280)">
        <use href="#rect" />
        <text x="0" y="-40" font-size="13" text-anchor="middle">Ув: char target_ilness[MAX]</text>
        <text x="0" y="-25" font-size="13" text-anchor="middle">Child *children - масіў</text>
        <text x="0" y="-8" font-size="13" text-anchor="middle">Вых: int (main)</text>
        <text x="0" y="10" font-size="13" text-anchor="middle">int number_of_children = 0;</text>
        <text x="0" y="25" font-size="13" text-anchor="middle">int result_count = 0;</text>
        <text x="0" y="40" font-size="13" text-anchor="middle">Child *c_w_t_illness = NULL;</text>
        
        <!-- Struct Annotation 1 -->
        <line x1="120" y1="0" x2="150" y2="0" stroke-dasharray="6,4" />
        <path d="M 155,-80 L 150,-80 L 150,105 L 155,105" />
        <g style="text-anchor: start;">
            <text x="160" y="-65" font-size="12" font-weight="bold">struct Child {</text>
            <text x="160" y="-50" font-size="12">  char first_name[MAX_ALLOW];</text>
            <text x="160" y="-35" font-size="12">  char surname[MAX_ALLOW];</text>
            <text x="160" y="-20" font-size="12">  int age;</text>
            <text x="160" y="-5" font-size="12">  int was_hospitalized;</text>
            <text x="160" y="10" font-size="12">  MedicalInfo health_info; };</text>
            <text x="160" y="35" font-size="12" font-weight="bold">union MedicalInfo {</text>
            <text x="160" y="50" font-size="12">  LocalRecord local;</text>
            <text x="160" y="65" font-size="12">  HospitalRecord hospital; };</text>
        </g>
    </g>
    <!-- Start: 280+60=340 | End: 480-60=420 -->
    <path d="M 250,340 L 250,420" marker-end="url(#arrow)" />

    <!-- Node 3: choose_input -->
    <g transform="translate(250, 480)">
        <use href="#proc" />
        <text x="0" y="-15" font-size="16" text-anchor="middle">выклік ф.</text>
        <text x="0" y="5" font-size="14" text-anchor="middle">choose_input(&amp;children,</text>
        <text x="0" y="25" font-size="14" text-anchor="middle">&amp;number_of_children)</text>
        
        <!-- Struct Annotation 2 -->
        <line x1="120" y1="0" x2="150" y2="0" stroke-dasharray="6,4" />
        <path d="M 155,-70 L 150,-70 L 150,85 L 155,85" />
        <g style="text-anchor: start;">
            <text x="160" y="-55" font-size="12" font-weight="bold">struct HospitalRecord {</text>
            <text x="160" y="-40" font-size="12">  char illness[MAX_ALLOW];</text>
            <text x="160" y="-25" font-size="12">  char att_doctor[MAX_ALLOW];</text>
            <text x="160" y="-10" font-size="12">  char adress[MAX_ALLOW];</text>
            <text x="160" y="5" font-size="12">  int hospital_number; };</text>
            <text x="160" y="30" font-size="12" font-weight="bold">struct LocalRecord {</text>
            <text x="160" y="45" font-size="12">  char illness[MAX_ALLOW];</text>
            <text x="160" y="60" font-size="12">  char loc_doctor[MAX_ALLOW]; };</text>
        </g>
    </g>
    <!-- Start: 480+60=540 | End: 660-60=600 -->
    <path d="M 250,540 L 250,600" marker-end="url(#arrow)" />

    <!-- Node 4: output_Child -->
    <g transform="translate(250, 660)">
        <use href="#proc" />
        <text x="0" y="-15" font-size="16" text-anchor="middle">выклік ф.</text>
        <text x="0" y="5" font-size="14" text-anchor="middle">output_Child(children,</text>
        <text x="0" y="25" font-size="14" text-anchor="middle">number_of_children)</text>
    </g>
    <!-- Start: 660+60=720 | End: 840-60=780 -->
    <path d="M 250,720 L 250,780" marker-end="url(#arrow)" />

    <!-- Node 5: choose_output -->
    <g transform="translate(250, 840)">
        <use href="#proc" />
        <text x="0" y="-15" font-size="16" text-anchor="middle">выклік ф.</text>
        <text x="0" y="5" font-size="14" text-anchor="middle">choose_output(children,</text>
        <text x="0" y="25" font-size="14" text-anchor="middle">number_of_children)</text>
    </g>
    <!-- Start: 840+60=900 | End: 1020-60=960 -->
    <path d="M 250,900 L 250,960" marker-end="url(#arrow)" />

    <!-- Node 6: printf (I/O) -->
    <g transform="translate(250, 1020)">
        <use href="#io" />
        <text x="0" y="-10" font-size="16" text-anchor="middle">Вывад:</text>
        <text x="0" y="10" font-size="13" text-anchor="middle">"Enter the target illness: "</text>
    </g>
    <!-- Start: 1020+60=1080 | End: 1200-60=1140 -->
    <path d="M 250,1080 L 250,1140" marker-end="url(#arrow)" />

    <!-- Node 7: read_line -->
    <g transform="translate(250, 1200)">
        <use href="#proc" />
        <text x="0" y="-20" font-size="16" text-anchor="middle">выклік ф.</text>
        <text x="0" y="5" font-size="14" text-anchor="middle">read_line(target_illness,</text>
        <text x="0" y="25" font-size="14" text-anchor="middle">MAX_ALLOWED, stdin)</text>
    </g>
    <!-- Start: 1200+60=1260 | End: 1380-25=1355 -->
    <path d="M 250,1260 L 250,1355" marker-end="url(#arrow)" />

    <!-- Connector А -->
    <g transform="translate(250, 1380)">
        <use href="#conn" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold" font-size="16">А</text>
    </g>


    <!-- ================= СТАРОНКА 1 / СЛУП 2 (X=750) ================= -->

    <!-- Entry Connector А -->
    <g transform="translate(750, 100)">
        <use href="#conn" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold" font-size="16">А</text>
    </g>
    <!-- Start: 100+25=125 | End: 280-60=220 -->
    <path d="M 750,125 L 750,220" marker-end="url(#arrow)" />

    <!-- Node 8: children_analysis -->
    <g transform="translate(750, 280)">
        <use href="#proc" />
        <text x="0" y="-20" font-size="16" text-anchor="middle">выклік ф.</text>
        <text x="0" y="5" font-size="13" text-anchor="middle">children_analysis(children,</text>
        <text x="0" y="20" font-size="13" text-anchor="middle">number_of_children,</text>
        <text x="0" y="35" font-size="13" text-anchor="middle">&amp;c_w_t_illness, ...)</text>
    </g>
    <!-- Start: 280+60=340 | End: 480-60=420 -->
    <path d="M 750,340 L 750,420" marker-end="url(#arrow)" />

    <!-- Node 9: Decision -->
    <g transform="translate(750, 480)">
        <use href="#rhomb" />
        <text x="0" y="5" font-size="16" text-anchor="middle">!result_count</text>
    </g>
    
    <!-- Path "Не" (False) Start: 480+60=540 | End: 660-60=600 -->
    <path d="M 750,540 L 750,600" marker-end="url(#arrow)" />
    <text x="760" y="570" font-size="15" text-anchor="start">Не</text>

    <!-- Path "Так" (True) Start: 750+120=870 | End: 960-25=935 -->
    <path d="M 870,480 L 935,480" marker-end="url(#arrow)" />
    <text x="885" y="470" font-size="15" text-anchor="start">Так</text>

    <!-- Connector Б -->
    <g transform="translate(960, 480)">
        <use href="#conn" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold" font-size="16">В</text>
    </g>

    <!-- Node 10: output_Child -->
    <g transform="translate(750, 660)">
        <use href="#proc" />
        <text x="0" y="-15" font-size="16" text-anchor="middle">выклік ф.</text>
        <text x="0" y="5" font-size="14" text-anchor="middle">output_Child(</text>
        <text x="0" y="25" font-size="14" text-anchor="middle">c_w_t_illness, result_count)</text>
    </g>
    <!-- Start: 660+60=720 | End: 840-60=780 -->
    <path d="M 750,720 L 750,780" marker-end="url(#arrow)" />

    <!-- Node 11: choose_output -->
    <g transform="translate(750, 840)">
        <use href="#proc" />
        <text x="0" y="-15" font-size="16" text-anchor="middle">выклік ф.</text>
        <text x="0" y="5" font-size="14" text-anchor="middle">choose_output(</text>
        <text x="0" y="25" font-size="14" text-anchor="middle">c_w_t_illness, result_count)</text>
    </g>
    <!-- Start: 840+60=900 | End: 1020-60=960 -->
    <path d="M 750,900 L 750,960" marker-end="url(#arrow)" />

    <!-- Node 12: free(children) -->
    <g transform="translate(750, 1020)">
        <use href="#proc" />
        <text x="0" y="-10" font-size="16" text-anchor="middle">выклік ф.</text>
        <text x="0" y="10" font-size="15" text-anchor="middle">free(children)</text>
    </g>
    <!-- Start: 1020+60=1080 | End: 1200-60=1140 -->
    <path d="M 750,1080 L 750,1140" marker-end="url(#arrow)" />

    <!-- Node 13: free(c_w_t_illness) -->
    <g transform="translate(750, 1200)">
        <use href="#proc" />
        <text x="0" y="-10" font-size="16" text-anchor="middle">выклік ф.</text>
        <text x="0" y="10" font-size="14" text-anchor="middle">free(c_w_t_illness)</text>
    </g>
    <!-- Start: 1200+60=1260 | End: 1380-25=1355 -->
    <path d="M 750,1260 L 750,1355" marker-end="url(#arrow)" />

    <!-- Connector В -->
    <g transform="translate(750, 1380)">
        <use href="#conn" />
        <text x="0" y="5" text-anchor="middle" font-weight="bold" font-size="16">С</text>
    </g>
</svg>