<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1650" width="100%" height="100%">
    <style>
        rect, polygon, path, line { fill: none; stroke: black; stroke-width: 1.5; }
        text { font-family: Arial, sans-serif; font-size: 15px; fill: black; stroke: none; }
        .bg { fill: white; stroke: none; }
        
        /* Цэнтроўка толькі для асноўных блокаў */
        .center-text { text-anchor: middle; dominant-baseline: central; }
    </style>
    <rect class="bg" width="1000" height="1650"/>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0,0 L 10,5 L 0,10 Z" style="fill: black; stroke: none;" />
        </marker>

        <!-- ================= ПЕРАМЕННЫЯ ФІГУР па ДАСТ ================= -->
        <!-- Асноўны памер: Шырыня (W) = 240, Вышыня (H) = 120 (Шырыня = 2 * Вышыня) -->
        <!-- Цэнтр заўсёды (0,0) -->
        
        <!-- 1. Тэрмінал (Начало/Конец). Вышыня строга ў 2 разы менш за асноўную! (H=60) -->
        <rect id="term" x="-120" y="-30" width="240" height="60" rx="30" ry="30" />
        
        <!-- 2. Прамавугольнік (дзеянне). W=240, H=120 -->
        <rect id="rect" x="-120" y="-60" width="240" height="120" />
        
        <!-- 3. Падпраграма (выклік функцыі). W=240, H=120 -->
        <g id="proc">
            <rect x="-120" y="-60" width="240" height="120" />
            <line x1="-105" x2="-105" y1="-60" y2="60" />
            <line x1="105" x2="105" y1="-60" y2="60" />
        </g>
        
        <!-- 4. Ромб (Умова). Краі дакладна на -120 і 120. W=240, H=120 -->
        <polygon id="rhomb" points="0,-60 120,0 0,60 -120,0" />
        
        <!-- 5. Паралелаграм (Увод/Вывад). Межы: X ад -120 да 120. W=240, H=120 -->
        <polygon id="io" points="-90,-60 120,-60 90,60 -120,60" />
    </defs>

    <!-- ==================== БЛОКІ (Цэнтральная вось X = 250) ==================== -->
    
    <!-- Y=80. Ніжні край тэрмінала: 80 + 30 = 110 -->
    <g transform="translate(250, 80)" class="center-text">
        <use href="#term" />
        <text>Начало</text>
    </g>

    <!-- 1. Стварэнне чаргі. Верхні край: 240 - 60 = 180 -->
    <g transform="translate(250, 240)">
        <use href="#rect" />
        <text class="center-text" y="-15">queue =</text>
        <text class="center-text" y="15">{NULL, NULL, 0}</text>
        
        <!-- КАМЕНТАРЫЙ 1 -->
        <line x1="120" y1="0" x2="160" y2="0" stroke-dasharray="6,4" />
        <path d="M 170,-60 L 160,-60 L 160,60 L 170,60" />
        <g style="text-anchor: start;">
            <text x="180" y="-40">typedef struct {</text>
            <text x="180" y="-20">&#160;&#160;&#160;&#160;Node *front;</text>
            <text x="180" y="0">&#160;&#160;&#160;&#160;Node *rear;</text>
            <text x="180" y="20">&#160;&#160;&#160;&#160;int size;</text>
            <text x="180" y="40">} HospitalQueue;</text>
        </g>
    </g>

    <!-- 2. Ініцыялізацыя сістэмы -->
    <g transform="translate(250, 440)">
        <use href="#proc" />
        <text class="center-text" y="-15">выклік ф.</text>
        <text class="center-text" y="15">initialize_system(&amp;queue)</text>
        
        <!-- КАМЕНТАРЫЙ 2 -->
        <line x1="120" y1="0" x2="160" y2="0" stroke-dasharray="6,4" />
        <path d="M 170,-100 L 160,-100 L 160,100 L 170,100" />
        <g style="text-anchor: start;">
            <text x="180" y="-80">typedef struct {</text>
            <text x="180" y="-60">&#160;&#160;&#160;&#160;int id;</text>
            <text x="180" y="-40">&#160;&#160;&#160;&#160;double x;</text>
            <text x="180" y="-20">&#160;&#160;&#160;&#160;double y;</text>
            <text x="180" y="0">&#160;&#160;&#160;&#160;int total_beds;</text>
            <text x="180" y="20">&#160;&#160;&#160;&#160;int free_beds;</text>
            <text x="180" y="40">&#160;&#160;&#160;&#160;char **patients_names;</text>
            <text x="180" y="60">&#160;&#160;&#160;&#160;DistanceFunc get_distance;</text>
            <text x="180" y="80">} Hospital;</text>
        </g>
    </g>

    <!-- 3. running = 1 -->
    <g transform="translate(250, 640)">
        <use href="#rect" />
        <text class="center-text" y="0">running = 1</text>
        
        <!-- КАМЕНТАРЫЙ 3 -->
        <line x1="120" y1="0" x2="160" y2="0" stroke-dasharray="6,4" />
        <path d="M 170,-60 L 160,-60 L 160,60 L 170,60" />
        <g style="text-anchor: start;">
            <text x="180" y="-30">typedef struct Node {</text>
            <text x="180" y="-10">&#160;&#160;&#160;&#160;Hospital data;</text>
            <text x="180" y="10">&#160;&#160;&#160;&#160;struct Node *next;</text>
            <text x="180" y="30">} Node;</text>
        </g>
    </g>

    <!-- 4. Умова цыклу -->
    <g transform="translate(250, 840)" class="center-text">
        <use href="#rhomb" />
        <text>running != 0</text>
    </g>

    <!-- 5. Апрацоўка каманды -->
    <g transform="translate(250, 1040)" class="center-text">
        <use href="#proc" />
        <text y="-15">running =</text>
        <text y="15">process_user_comm(&amp;queue)</text>
    </g>

    <!-- 6. Ачыстка памяці -->
    <g transform="translate(250, 1240)" class="center-text">
        <use href="#proc" />
        <text y="-15">выклік ф.</text>
        <text y="15">free_queue(&amp;queue)</text>
    </g>

    <!-- 7. Вывад Goodbye -->
    <g transform="translate(250, 1440)" class="center-text">
        <use href="#io" />
        <text y="-15">Вывад:</text>
        <text y="15">"System memory cleared..."</text>
    </g>

    <!-- 8. Канец. Верхні край: 1580 - 30 = 1550 -->
    <g transform="translate(250, 1580)" class="center-text">
        <use href="#term" />
        <text>Конец</text>
    </g>

    <!-- Тэкставыя меткі ўмоў -->
    <text text-anchor="start" x="260" y="915">да</text>
    <text text-anchor="start" x="380" y="820">нет</text>

    <!-- ==================== СТРЭЛКІ ==================== -->
    
    <line x1="250" y1="110" x2="250" y2="175" marker-end="url(#arrow)"/>
    <line x1="250" y1="300" x2="250" y2="375" marker-end="url(#arrow)"/>
    <line x1="250" y1="500" x2="250" y2="575" marker-end="url(#arrow)"/>
    <line x1="250" y1="700" x2="250" y2="775" marker-end="url(#arrow)"/>
    
    <!-- Галіна "да" (унутр цыклу) -->
    <line x1="250" y1="900" x2="250" y2="975" marker-end="url(#arrow)"/>
    
    <!-- ВЯРТАННЕ ЦЫКЛА -->
    <path d="M 250,1100 L 250,1140 L 50,1140 L 50,750 L 240,750" marker-end="url(#arrow)"/>

    <!-- Галіна "нет" (выхад з цыклу) -->
    <path d="M 370,840 L 580,840 L 580,1160 L 250,1160 L 250,1175" marker-end="url(#arrow)"/>

    <!-- Працяг да канца -->
    <line x1="250" y1="1300" x2="250" y2="1375" marker-end="url(#arrow)"/>
    <line x1="250" y1="1500" x2="250" y2="1545" marker-end="url(#arrow)"/>
</svg>