<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1020" width="100%" height="100%">
    <style>
        rect, polygon, path, line { fill: none; stroke: black; stroke-width: 1.5; }
        text { font-family: Arial, sans-serif; font-size: 15px; text-anchor: middle; dominant-baseline: central; fill: black; stroke: none; }
        .bg { fill: white; stroke: none; }
    </style>
    <rect class="bg" width="800" height="1020"/>

    <defs>
        <!-- Маркер стрэлкі (поўнасцю чорны) -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0,0 L 10,5 L 0,10 Z" style="fill: black; stroke: none;" />
        </marker>

        <!-- "ПЕРАМЕННЫЯ" ФІГУР (цэнтраваныя па X=0, Y=0) -->
        
        <!-- 1. Тэрмінал (Пачатак/Канец): шырыня 160, вышыня 40 -->
        <rect id="term" x="-80" y="-20" width="160" height="40" rx="20" ry="20" />
        
        <!-- 2. Падпраграма: шырыня 160, вышыня 80 -->
        <g id="proc">
            <rect x="-80" y="-40" width="160" height="80" />
            <line x1="-65" x2="-65" y1="-40" y2="40" />
            <line x1="65" x2="65" y1="-40" y2="40" />
        </g>
        
        <!-- 3. Ромб (умова): шырыня 160, вышыня 80 -->
        <polygon id="rhomb" points="0,-40 80,0 0,40 -80,0" />
        
        <!-- 4. Паралелаграм стандартны (увод/вывад): шырыня 160, вышыня 80 -->
        <polygon id="io" points="-60,-40 80,-40 60,40 -80,40" />

        <!-- 5. Прамавугольнік стандартны (дзеянне): шырыня 160, вышыня 80 -->
        <rect id="rect" x="-80" y="-40" width="160" height="80" />
    </defs>

    <!-- ==================== БЛОКІ ==================== -->
    
    <g transform="translate(300, 60)">
        <use href="#term" />
        <text>Начало</text>
    </g>

    <!-- НОВЫ БЛОК (Звычайны прамавугольнік, 160x80) -->
    <g transform="translate(300, 180)">
        <use href="#rect" />
        <text y="-20">Ув: choice -</text>
        <text y="0">цэлы лік, для</text>
        <text y="20">выбараў карыстальніка</text>
    </g>
<!-- КАМЕНТАРЫЙ З КОДАМ -->
<g transform="translate(380, 180)">
    <!-- Пункцір -->
    <line x1="0" y1="0" x2="30" y2="0" stroke-dasharray="6,4" />
    <!-- Дужка (на X=30, вусікі заканчваюцца на X=40) -->
    <path d="M 40,-40 L 30,-40 L 30,40 L 40,40" />
    
    <!-- ТЭКСТ КАМЕНТАРЫЯ -->
    <!-- Changed x="50" to x="80" to move the text much further to the right -->
    <g style="text-anchor: start;">
        <text x="85" y="-30">struct Stack {</text>
        <text x="85" y="-10">&#160;&#160;&#160;&#160;char&#160;&#160;&#160;data;</text>
        <text x="85" y="10">&#160;&#160;&#160;&#160;struct Stack* next;</text>
        <text x="85" y="30">};</text>
    </g>
</g>

    <g transform="translate(300, 300)">
        <use href="#proc" />
        <text y="-10">выклік ф.</text>
        <text y="15">showMenu()</text>
    </g>

    <g transform="translate(300, 420)">
        <use href="#proc" />
        <text y="-20">choice =</text>
        <text y="0">выклік ф.</text>
        <text y="20">getMenuChoice()</text>
    </g>

    <g transform="translate(300, 540)">
        <use href="#rhomb" />
        <text>choice</text>
    </g>

    <!-- Тры галіны -->
    <g transform="translate(100, 660)">
        <use href="#proc" />
        <text y="-10">выклік ф.</text>
        <text y="15">handleCheck()</text>
    </g>

    <g transform="translate(300, 660)">
        <use href="#io" />
        <text y="-10">Вывад:</text>
        <text y="15">"Goodbye!"</text>
    </g>

    <g transform="translate(500, 660)">
        <use href="#io" />
        <text y="-20">Вывад:</text>
        <text y="0">"Unknown</text>
        <text y="20">option..."</text>
    </g>

    <g transform="translate(300, 820)">
        <use href="#rhomb" />
        <text>choice != 2</text>
    </g>

    <g transform="translate(300, 940)">
        <use href="#term" />
        <text>Конец</text>
    </g>

    <!-- Тэкставыя меткі ўмоў -->
    <text x="160" y="530">1</text>
    <text x="315" y="595">2</text>
    <text x="440" y="530">інакш</text>
    <text x="180" y="810">да</text>
    <text x="320" y="880">нет</text>

    <!-- ==================== СТРЭЛКІ ==================== -->
    
    <line x1="300" y1="80" x2="300" y2="135" marker-end="url(#arrow)"/>
    <line x1="300" y1="220" x2="300" y2="255" marker-end="url(#arrow)"/>
    <line x1="300" y1="340" x2="300" y2="375" marker-end="url(#arrow)"/>
    <line x1="300" y1="460" x2="300" y2="495" marker-end="url(#arrow)"/>

    <!-- Разгалінаванне -->
    <path d="M 220,540 L 100,540 L 100,615" marker-end="url(#arrow)"/>
    <line x1="300" y1="580" x2="300" y2="615" marker-end="url(#arrow)"/>
    <path d="M 380,540 L 500,540 L 500,615" marker-end="url(#arrow)"/>

    <!-- Зборка -->
    <path d="M 100,700 L 100,740 L 300,740"/>
    <path d="M 500,700 L 500,740 L 300,740"/>
    <line x1="300" y1="700" x2="300" y2="740"/>
    
    <!-- Да ўмовы цыкла -->
    <line x1="300" y1="740" x2="300" y2="775" marker-end="url(#arrow)"/>

    <!-- Вяртанне цыкла (ідзе наверх і злучаецца з вертыкальнай лініяй перад showMenu) -->
    <path d="M 220,820 L 10,820 L 10,240 L 290,240" marker-end="url(#arrow)"/>

    <!-- Канец -->
    <line x1="300" y1="860" x2="300" y2="915" marker-end="url(#arrow)"/>
</svg>